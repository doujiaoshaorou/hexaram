name: Build Hexaram Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rank-analysis-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rank-analysis-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run typecheck
      - run: ../scripts/build-windows.ps1 -OutputDirectory ../.tools/windows-release
      - uses: actions/upload-artifact@v4
        with:
          name: Hexaram-Windows-x64-Installer
          path: .tools/windows-release/*-setup.exe
